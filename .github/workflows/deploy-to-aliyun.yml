name: 部署到阿里云ECS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    name: 部署应用到ECS
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 安装依赖
        run: npm ci
      
      - name: 构建项目
        run: npm run build
      
      - name: 上传构建文件和配置到ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_SSH_HOST }}
          username: ${{ secrets.ALIYUN_SSH_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          source: "dist/*,deploy/nginx.conf"
          target: "/tmp/my-music-player-build"
          strip_components: 0
      
      - name: 部署到ECS服务器
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEPLOY_PORT: 3000
        with:
          host: ${{ secrets.ALIYUN_SSH_HOST }}
          username: ${{ secrets.ALIYUN_SSH_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          envs: DEPLOY_PORT
          script: |
            # 设置配置
            APP_NAME="my-music-player"
            APP_DIR="$HOME/apps/$APP_NAME"
            
            # 创建应用目录
            mkdir -p $APP_DIR
            
            # 复制构建文件
            rm -rf $APP_DIR/dist
            mv /tmp/my-music-player-build/dist $APP_DIR/dist
            
            # 停止旧的 serve 进程（如果有）
            pm2 delete $APP_NAME 2>/dev/null || true
            
            # 安装 Nginx（如果未安装）
            if ! command -v nginx &>/dev/null; then
              if command -v yum &>/dev/null; then
                sudo yum install -y nginx
              elif command -v apt-get &>/dev/null; then
                sudo apt-get update && sudo apt-get install -y nginx
              fi
            fi
            
            # 部署 Nginx 配置（替换路径占位符）
            sudo cp /tmp/my-music-player-build/deploy/nginx.conf /etc/nginx/conf.d/my-music-player.conf
            sudo sed -i "s|__APP_DIR__|$APP_DIR|g" /etc/nginx/conf.d/my-music-player.conf
            
            # 清理临时文件
            rm -rf /tmp/my-music-player-build
            
            # 检查配置并重启 Nginx
            sudo nginx -t && sudo systemctl restart nginx
            sudo systemctl enable nginx
            
            echo "部署完成! 访问地址: http://$(curl -s ifconfig.me):$DEPLOY_PORT"
      
      - name: 部署状态通知
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✓ 部署成功!"
            echo "访问地址: http://${{ secrets.ALIYUN_SSH_HOST }}:3000"
          else
            echo "✗ 部署失败,请查看日志"
          fi
